<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Search engines should list connectionguard.net, not the dashboard login. -->
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Connection Guard</title>
    <script>
      // api.connectionguard.net serves the same assets; sign-in only works on the app origin.
      if (location.hostname === "api.connectionguard.net") {
        location.replace("https://app.connectionguard.net" + location.pathname + location.search + location.hash);
      }
    </script>
    <script>
      // Apply the theme before first paint: stored choice, else the system setting.
      (function () {
        var t = null;
        try { t = localStorage.getItem("cg-theme"); } catch (e) {}
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
